<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sarper'in Yapay Zekâyla İmtihanı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: tek sahne, üstte ilerleme şeridi, ortada hikâye/oylama (QR + seçenek düğmeleri), altta gezinme. Projeksiyon için büyük tipografi. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E2E7EE; --fg:#141A26; --muted:#5B6578; --line:#CBD3DE;
  --signal:#B7790A; --alarm:#C9343A; --win:#17894D; --win-soft:#D5F0E1;
  --o1:#D4473F; --o2:#B57E0B; --o3:#2273C9;
  --o1-soft:#F8DEDC; --o2-soft:#F6EACB; --o3-soft:#D8E7F7;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-story:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"JetBrains Mono", Consolas, "Courier New", monospace;
  --base:clamp(17px, min(1.15vw, 2.5vh) + 7px, 38px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1420; --surface:#171E2D; --surface-2:#222B3D; --fg:#ECE8E1; --muted:#9AA3B5; --line:#2E384C;
  --signal:#F2B33D; --alarm:#F0605D; --win:#3DD68C; --win-soft:#173A2A;
  --o1:#F0706A; --o2:#F2B33D; --o3:#5DAEF7;
  --o1-soft:#3A2228; --o2-soft:#3A3122; --o3-soft:#1D3048; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1420; --surface:#171E2D; --surface-2:#222B3D; --fg:#ECE8E1; --muted:#9AA3B5; --line:#2E384C;
  --signal:#F2B33D; --alarm:#F0605D; --win:#3DD68C; --win-soft:#173A2A;
  --o1:#F0706A; --o2:#F2B33D; --o3:#5DAEF7;
  --o1-soft:#3A2228; --o2-soft:#3A3122; --o3-soft:#1D3048; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-story);font-size:var(--base);line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:1500px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:1.1em;padding-block:0.9em 1.1em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

.top{display:flex;align-items:center;gap:0.9em;flex-wrap:wrap;font-family:var(--f-mono);font-size:0.6em;color:var(--muted)}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35em;color:var(--fg);letter-spacing:-0.01em}
.prog{display:flex;gap:6px;flex:1;min-width:220px}
.prog span{flex:1;height:30px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--muted);transition:background .3s,color .3s}
.prog span.done{background:var(--line);color:var(--fg)}
.prog span.now{background:var(--signal);color:var(--bg)}
.tbtn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--muted);font-family:var(--f-mono);font-size:1em}
.tbtn:hover{color:var(--fg);border-color:var(--muted)}

.stage{flex:1;display:flex;flex-direction:column;gap:0.8em;min-width:0}
/* Akıllı tahta: geniş ekranda sayfa kaymaz; içerik sahneye sığacak kadar küçülür (fit()) */
@media (min-width:761px){
  html,body{overflow:hidden}
  .app{height:100vh;height:100dvh;min-height:0;box-sizing:border-box}
  .stage{min-height:0;overflow:hidden}
  .scene-grid{align-items:center;grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr)}
  .scene-grid .art{width:fit-content;max-width:100%;justify-self:center}
  .stage .scene-grid .art svg{width:auto;height:auto;max-width:100%;max-height:var(--stage-h,60vh)}
  .cover{padding-top:0.4em}
  .cover-art .art{width:fit-content;max-width:100%}
  .cover-art{margin-bottom:0.6em}
  .cover{align-items:center}
  .cover-art .art svg{height:28vh;width:auto;max-width:100%}
  .cover .lead{margin:0.4em 0 0.7em}
  .cover h1{font-size:2.5em}
  .stage .vgrid{grid-template-columns:minmax(0,min(13em,38vh)) minmax(0,1fr)}
  .stage .opt .txt{font-size:1em}
  .stage .path{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0.5em 0.9em}
}
.eyebrow{font-family:var(--f-mono);font-size:0.58em;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:0.8em;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--fg)}
.chip.skill{border-color:var(--signal);color:var(--signal)}
h1,h2{font-family:var(--f-display);text-wrap:balance;letter-spacing:-0.015em;margin:0;line-height:1.12}
h1{font-size:3.1em;font-weight:800}
h2{font-size:1.6em;font-weight:700}
.story{display:flex;flex-direction:column;gap:0.75em;max-width:44em}
.story p{margin:0}
.time{font-family:var(--f-mono);font-size:0.62em;font-weight:700;letter-spacing:0.08em;color:var(--signal);text-transform:uppercase}
.line{display:grid;grid-template-columns:7.5em 1fr;gap:0.9em;align-items:baseline}
.line .who{font-family:var(--f-display);font-weight:700;font-size:0.72em;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);text-align:right}
.line p{font-style:italic}
.msg{align-self:flex-start;max-width:30em;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:0.55em 0.9em;font-family:var(--f-display);font-size:0.85em}
.msg b{display:block;font-size:0.7em;color:var(--muted);font-weight:700}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0.9em 1.1em;font-family:var(--f-mono);max-width:28em}
.meter .lab{font-size:0.55em;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase}
.meter .val{font-size:2.6em;font-weight:700;color:var(--alarm);line-height:1.1;font-variant-numeric:tabular-nums}
.meter .bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-block:0.4em}
.meter .bar i{display:block;height:100%;background:var(--alarm);width:0;transition:width 1.6s cubic-bezier(.2,.7,.2,1)}
.meter .sub{font-size:0.6em;color:var(--muted)}
.quote{font-size:1.2em;font-style:italic;border-left:4px solid var(--signal);padding-left:0.8em}
.live{display:inline-flex;align-items:center;gap:0.4em;font-family:var(--f-mono);font-size:0.6em;font-weight:700;color:var(--alarm);letter-spacing:0.1em}
.live::before{content:"";width:0.7em;height:0.7em;border-radius:50%;background:var(--alarm);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:0.2}}

.cover{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:2em;align-items:start;padding-top:1.5em}
.cover .lead{font-size:1.15em;color:var(--muted);max-width:28em;margin:0.6em 0 1em}
.side{display:flex;flex-direction:column;gap:0.8em}
.team{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1em 1.2em;font-family:var(--f-display)}
.team h3{margin:0 0 0.6em;font-size:0.65em;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted)}
.team ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0.35em;counter-reset:u}
.team li{display:grid;grid-template-columns:1.6em 1fr auto;gap:0.6em;align-items:baseline;font-size:0.85em;counter-increment:u;border-bottom:1px solid var(--line);padding-bottom:0.3em}
.team li:last-child{border-bottom:0;padding-bottom:0}
.team li::before{content:counter(u);font-family:var(--f-mono);font-weight:700;color:var(--signal);font-size:0.85em}
.team .ad{font-weight:700}
.team .no{font-family:var(--f-mono);color:var(--muted);font-size:0.85em}
.cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0.8em}
.cast-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0.8em;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0.45em;font-family:var(--f-display)}
.cast-card .av{width:5.2em;height:5.2em;border-radius:50%;overflow:hidden;border:3px solid var(--line);line-height:0}
.cast-card .av svg,.cast-chip .av svg{width:100%;height:100%}
.cast-card b{display:block;font-size:0.95em}
.cast-card span:not(.av){display:block;font-size:0.68em;color:var(--muted);line-height:1.35}
.remind{display:flex;flex-wrap:wrap;align-items:center;gap:0.5em 0.7em;font-family:var(--f-display);margin-top:0.4em}
.remind-t{font-family:var(--f-mono);font-size:0.58em;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}
.cast-chip{display:flex;align-items:center;gap:0.4em;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0.2em 0.8em 0.2em 0.2em;font-size:0.72em}
.cast-chip .av{width:2.2em;height:2.2em;border-radius:50%;overflow:hidden;line-height:0}
.line.boxed{border:3px solid var(--c-sarper);border-radius:14px;padding:0.55em 0.8em;background:var(--surface)}
.roles{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1em;display:flex;flex-direction:column;gap:0.45em;font-family:var(--f-display);font-size:0.7em}
.roles h3{margin:0 0 0.3em;font-size:1em;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)}
.roles label{display:grid;grid-template-columns:8.5em 1fr;gap:0.6em;align-items:center}
.roles input{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0}
.roles .st{font-family:var(--f-mono);font-size:0.85em;color:var(--muted)}
.roles .st.ok{color:var(--win)}

/* Oylama */
.vgrid{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr);gap:1.2em;align-items:start}
.qr{background:#FFFFFF;border-radius:14px;padding:0.7em;display:flex;flex-direction:column;align-items:center;gap:0.4em;border:1px solid var(--line)}
.qr .code{width:100%;aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.qr .code img,.qr .code canvas{width:100%!important;height:auto!important;image-rendering:pixelated}
.qr .cap{font-family:var(--f-mono);font-size:0.5em;color:#3A4254;text-align:center;font-weight:700;letter-spacing:0.06em}
.qr .ph{font-family:var(--f-display);font-size:0.6em;color:#3A4254;text-align:center;padding:1em;border:2px dashed #B9C2CF;border-radius:10px}
.total{font-family:var(--f-mono);font-size:0.6em;color:var(--muted);text-align:center}
.opts{display:flex;flex-direction:column;gap:0.6em;min-width:0}
.opt{--c:var(--o1);--s:var(--o1-soft);position:relative;overflow:hidden;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0.7em 0.9em;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0.8em;align-items:center;transition:opacity .4s, border-color .3s, background .3s;min-width:0}
.opt[data-k="2"]{--c:var(--o2);--s:var(--o2-soft)} .opt[data-k="3"]{--c:var(--o3);--s:var(--o3-soft)}
.opt .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--s);transition:width .6s ease;z-index:0}
.opt > *:not(.fill){position:relative;z-index:1}
.opt .num{font-family:var(--f-mono);font-weight:700;font-size:0.9em;width:2em;height:2em;border-radius:8px;display:grid;place-items:center;background:var(--c);color:var(--bg)}
.opt .txt{font-family:var(--f-display);font-size:0.88em;line-height:1.3}
.opt .right{display:flex;align-items:center;gap:0.35em;font-family:var(--f-mono)}
.opt .right output{min-width:1.8em;text-align:right;font-size:1.5em;font-weight:700;font-variant-numeric:tabular-nums;color:var(--c)}
.opt .right button{width:1.6em;height:1.6em;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:0.7em;opacity:0.6}
.opt .right button:hover{opacity:1}
.opt.win{--c:var(--win);--s:var(--win-soft);border-color:var(--win);background:var(--win-soft)}
.opt.win .fill{width:100%!important}
.opt.lose,.opt.out{opacity:0.3}
.vbar{display:flex;gap:0.7em;flex-wrap:wrap;align-items:center;font-family:var(--f-display);font-size:0.75em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0.5em 1.1em;font-family:var(--f-display);font-weight:700}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:0.4;cursor:default}
.banner{font-family:var(--f-display);font-weight:700;font-size:1.05em;padding:0.55em 0.9em;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.banner.tie{border-color:var(--signal);color:var(--signal)}
.banner.ok{border-color:var(--win);color:var(--win);background:var(--win-soft)}
.count{font-family:var(--f-mono);font-weight:700;font-size:2.4em;color:var(--signal);font-variant-numeric:tabular-nums;line-height:1}
.hint{font-family:var(--f-mono);font-size:0.55em;color:var(--muted)}

.compose{display:flex;flex-direction:column;gap:0.6em;max-width:44em}
.compose .lead2{font-size:1.25em;font-style:italic}
.compose textarea{font:inherit;font-style:italic;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:0.6em 0.8em;min-height:3.2em;resize:vertical;width:100%;box-sizing:border-box}
.mic{display:inline-flex;gap:0.5em;align-items:center;font-family:var(--f-mono);font-size:0.58em;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--signal)}

.path{display:flex;flex-direction:column;gap:0.45em;font-family:var(--f-display);font-size:0.74em}
.prow{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:0.8em;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0.5em 0.8em}
.prow.voice{background:transparent;border-style:dashed}
.prow .n{font-family:var(--f-mono);font-weight:700;color:var(--signal)}
.prow small{display:block;color:var(--muted);font-size:0.75em}
.prow .v{font-family:var(--f-mono);font-size:0.8em;color:var(--muted);white-space:nowrap}
.refl{display:flex;flex-direction:column;gap:0.9em;max-width:42em}
.refl div{display:grid;grid-template-columns:2em 1fr;gap:0.6em;font-family:var(--f-display);font-size:1.05em}
.refl b{font-family:var(--f-mono);color:var(--signal)}
.src{font-size:0.72em;display:flex;flex-direction:column;gap:0.5em;max-width:48em}
.src p{margin:0;padding-left:1.5em;text-indent:-1.5em}
.ethic{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0.9em 1.1em;font-size:0.72em;max-width:48em}

.nav{display:flex;justify-content:space-between;align-items:center;gap:1em;border-top:1px solid var(--line);padding-top:0.7em;font-family:var(--f-display)}
.nav .btn{font-size:0.75em}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade,.live::before{animation:none}.meter .bar i,.opt,.opt .fill{transition:none}}

/* İllüstrasyonlar: sunuma gömülü SVG, renkler temaya göre değişir */
:root{
  --a-sky:#CFE0F2; --a-wall:#E4E8EF; --a-wall2:#D2D9E4; --a-floor:#C3CCD9; --a-wood:#C08F62; --a-wood2:#946A47;
  --a-ink:#1B2230; --a-paper:#FFFFFF; --a-line:#C9D0DB; --a-screen:#1B2230; --a-board:#2F4A3F; --a-moon:#F4E7B8; --a-tie:#B2434A;
  --frame:#F7F3EA;
  --sk1:#EDBB96; --sk2:#C98E66; --sk3:#9E6A48;
  --h1:#3A2A22; --h2:#1D1D24; --h3:#7A4A2A; --h4:#9097A1;
  --c-elif:#D69A2D; --c-sarper:#2F6DB5; --c-betul:#B2434A; --c-yusuf:#4D5566; --c-zeynep:#2E9466; --c-muhabir:#7A5BC7; --c-grey:#7C8493; --c-crowd:#AEB6C3;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --a-sky:#0B1222; --a-wall:#1B2335; --a-wall2:#242E44; --a-floor:#141B2A; --a-wood:#6A4E35; --a-wood2:#4C3824;
  --a-ink:#0B0F18; --a-paper:#DCE1EA; --a-line:#9AA3B5; --a-screen:#0B0F18; --a-board:#1E3029; --a-moon:#F2DFA0; --c-crowd:#3A4459; --frame:#2A3448 }}
:root[data-theme="dark"]{
  --a-sky:#0B1222; --a-wall:#1B2335; --a-wall2:#242E44; --a-floor:#141B2A; --a-wood:#6A4E35; --a-wood2:#4C3824;
  --a-ink:#0B0F18; --a-paper:#DCE1EA; --a-line:#9AA3B5; --a-screen:#0B0F18; --a-board:#1E3029; --a-moon:#F2DFA0; --c-crowd:#3A4459; --frame:#2A3448 }
.art{border-radius:10px;overflow:hidden;border:10px solid var(--frame);outline:2px solid var(--line);box-shadow:0 12px 28px rgba(0,0,0,.28);background:var(--a-wall);line-height:0}
.art svg{width:100%;height:auto;display:block}
.art text{font-family:var(--f-mono);font-weight:700}
.scene-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,0.85fr);gap:1.6em;align-items:start}
.scene-grid .art{position:sticky;top:1em}
.cover-art{margin-bottom:0.9em}
.line{grid-template-columns:2.6em 1fr;gap:0.7em;align-items:start}
.line .av{width:2.6em;height:2.6em;border-radius:50%;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);line-height:0}
.line .av svg{width:100%;height:100%}
.line .who{text-align:left;display:block;margin-bottom:0.1em}
.line p{margin:0}
@media (max-width:760px){
  .scene-grid{grid-template-columns:1fr}
  .scene-grid .art{position:static;order:-1;max-width:28em}
  .cover,.vgrid{grid-template-columns:1fr}
  .qr{max-width:16em}
  h1{font-size:2.2em}
  .line{grid-template-columns:2.2em 1fr;gap:0.5em}
  .line .av{width:2.2em;height:2.2em}
  .prow{grid-template-columns:2.4em minmax(0,1fr)}
  .prow .v{grid-column:2}
}
</style>

<div class="app">
  <header class="top">
    <span class="brand">Sarper'in Yapay Zekâyla İmtihanı</span>
    <div class="prog" id="prog" aria-label="İlerleme"></div>
    <button class="tbtn" id="themeBtn" type="button" title="Tema (T)">Tema</button>
    <button class="tbtn" id="fsBtn" type="button" title="Tam ekran (F)">Tam ekran</button>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <nav class="nav">
    <button class="btn" id="backBtn" type="button">← Geri</button>
    <button class="btn primary" id="nextBtn" type="button">İleri →</button>
  </nav>
</div>

<script>
/* ============ İLLÜSTRASYONLAR ============
   Hepsi sunuma gömülü SVG: internet gerektirmez, telif sorunu yoktur, renkleri temaya uyar. */
const F = c => `style="fill:var(--${c})"`;
const S = (c, w) => `style="fill:none;stroke:var(--${c});stroke-width:${w};stroke-linecap:round;stroke-linejoin:round"`;
/* Grubun hazırladığı karakter görselleri (arka planı şeffaf, sunuma gömülü).

let imgN = 0;
function charImg(key, x, y, s = 1, o = {}){
  const c = IMG_CHARS[key], k = c.k * s, id = "ci" + (++imgN);
  return `<g${o.op ? ` opacity="${o.op}"` : ""}><defs><clipPath id="${id}"><rect x="${x-60*s}" y="${y-40*s}" width="${120*s}" height="${112*s}"/></clipPath></defs>
    <image href="${c.src}" x="${x-c.cx*k}" y="${y-c.cy*k}" width="${c.w*k}" height="${c.h*k}" clip-path="url(#${id})"/></g>`;
}

/* Bir karakter: (x,y) baş merkezi, s ölçek. Gövde y+72*s'ye kadar iner. */
function person(key, x, y, s = 1, o = {}){
  if (IMG_CHARS[key]) return charImg(key, x, y, s, o);
  const c = CHAR[key], h = HAIR[c.style];
  return `<g transform="translate(${x} ${y}) scale(${s})"${o.op ? ` opacity="${o.op}"` : ""}>
    <path d="M-26,72 L-26,40 Q-26,21 0,21 Q26,21 26,40 L26,72Z" ${F(c.top)}/>
    ${c.hood ? `<path d="M-16,22 Q0,35 16,22" ${S("a-ink",2.2)} opacity=".35"/>` : ""}
    ${c.tie ? `<path d="M0,22 L-3.5,27 L0,46 L3.5,27Z" ${F("a-tie")}/>` : ""}
    <rect x="-6" y="9" width="12" height="14" rx="3" ${F(c.skin)}/>
    ${h.back ? `<g ${F(c.hair)}>${h.back}</g>` : ""}
    <circle r="16" ${F(c.skin)}/>
    <g ${F(c.hair)}>${h.front}</g>
    ${c.beard ? `<path d="M-14,5 Q-13,17 0,18 Q13,17 14,5 Q8,10 0,10 Q-8,10 -14,5Z" ${F(c.hair)}/>` : ""}
    ${c.flat ? "" : `<circle cx="-5.5" cy="2" r="1.7" ${F("a-ink")}/><circle cx="5.5" cy="2" r="1.7" ${F("a-ink")}/>`}
    ${c.glasses ? `<g ${S("a-ink",1.3)}><circle cx="-5.5" cy="2" r="4.6"/><circle cx="5.5" cy="2" r="4.6"/><path d="M-0.9,2H0.9"/></g>` : ""}
    ${o.phone ? `<g transform="translate(${o.phone === "l" ? -30 : 14} 30) rotate(${o.phone === "l" ? -8 : 8})"><rect width="16" height="26" rx="3" ${F("a-ink")}/><rect x="2" y="3" width="12" height="18" rx="1" ${F(o.rec ? "alarm" : "o3")} opacity=".85"/></g>` : ""}
    ${o.mic ? `<g transform="translate(-34 26) rotate(-25)"><rect x="-2.5" y="6" width="5" height="22" rx="2" ${F("a-ink")}/><circle r="7" ${F("a-ink")}/></g>` : ""}

  </g>`;
}

const OLD_VOTE_URL = "https://script.google.com/macros/s/AKfycbxUeQs6d1V-k9KzCtUpifXVVomJTg_ENvDjFL4j_kw6vaIzC043m3GoU6AhnxVAelZl/exec";

const PRESENTER_KEY = "4aec09d9610a541a";

/* ============ AKIŞ ============ */
function flow(){
  const f = [{t:"cover", g:-1}, {t:"cast", g:-1}, {t:"join", g:-1}];
  INTRO.forEach((sc, j) => f.push({t:"scene", g:0, title:sc.title, items:sc.items, art:ART_MAP.intro[j]}));
  for (let i=0;i<STEPS.length;i++){
    const s = STEPS[i], g = i+1;
    const am = ART_MAP[s.id] || {};
    if (s.setup) f.push({t:"scene", g, title:"Soru "+g, items:s.setup, art:am.setup});
    f.push({t:"vote", g, step:s});
    const ch = st.choices[s.id];
    if (!ch) return f;
    f.push({t:"scene", g, title:"Seçim "+g+": "+s.opts[ch].short, items:s.opts[ch].scene, art:am[ch]});
    if (s.complete && !s.complete.after) f.push({t:"complete", g, step:s});
    if (s.converge) f.push({t:"scene", g, title: i===STEPS.length-1 ? "Son" : "Hikâye sürüyor", items:s.converge, art:am.conv});
    if (s.complete && s.complete.after) f.push({t:"complete", g, step:s});
  }
  f.push({t:"path", g:8}, {t:"reflect", g:8}, {t:"sources", g:8});
  return f;
}

/* ============ YARDIMCILAR ============ */
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
}
function renderItems(items, g){
  const list = typeof items === "function" ? items(st) : items;
  const box = el("div", {class:"story"});
  list.forEach((it, idx) => {
    let n;
    if (typeof it === "string") n = el("p", null, it);
    else if (it.k === "time") n = el("div", {class:"time"}, it.t);
    else if (it.k === "live") n = el("div", {class:"live"}, it.t);
    else if (it.k === "msg") n = el("div", {class:"msg"}, el("b", null, it.from), it.t);
    else if (it.k === "quote") n = el("p", {class:"quote"}, it.t);
    else if (it.k === "meter"){
      const bar = el("i"); n = el("div", {class:"meter"}, el("div",{class:"lab"}, it.label), el("div",{class:"val"}, "%"+it.v), el("div",{class:"bar"}, bar), el("div",{class:"sub"}, it.sub));
      requestAnimationFrame(() => requestAnimationFrame(() => bar.style.width = it.v + "%"));
    }
    else if (it.who){
      const av = el("span", {class:"av", "aria-hidden":"true"});
      av.innerHTML = avatar(WHO[it.who] || "kalabalik");
      n = el("div", {class: "line" + (g === 4 && it.who === "Sarper" ? " boxed" : "")}, av, el("div", null, el("span",{class:"who"}, it.who), el("p", null, "“"+it.t+"”")));
    }
    n.classList.add("fade"); n.style.animationDelay = (idx*0.12)+"s";
    box.append(n);
  });
  return box;
}
function vstate(s){
  if (!st.vp[s.id]) st.vp[s.id] = { phase:"open", among:["1","2","3"], counts:{1:0,2:0,3:0}, manual:{1:0,2:0,3:0}, round:0, lottery:false };
  return st.vp[s.id];
}
function clearFrom(stepIdx){
  st.session = Math.random().toString(36).slice(2, 8); /* yeniden oylamada eski oylar sayılmasın */
  for (let i=stepIdx;i<STEPS.length;i++){
    const s = STEPS[i]; delete st.choices[s.id]; delete st.vp[s.id];
    if (s.complete) delete st.texts[s.complete.key];
  }
}
const total = (vs) => vs.among.reduce((a,k) => a + vs.counts[k], 0);

/* ============ DİJİTAL OYLAMA BAĞLANTISI (TEK QR) ============
   voteUrl boşsa sayfa elle sayım moduyla çalışır.
   Telefonlar voteUrl'i bir kez açar. Sunum, ekrandaki soruyu ?action=sync ile sunucuya bildirir;
   sunucu açık sorunun oylarını {counts:{1:n,2:n,3:n}} olarak döndürür. */
function voteKey(s){ const vs = vstate(s); return st.session + "-" + s.id + "-r" + vs.round; }
let lastSync = 0, syncBusy = false;
function liveState(){
  const scr = flow()[st.pos];
  if (scr && scr.t === "vote" && !st.choices[scr.step.id]) return { s: scr.step, q: voteKey(scr.step), o: vstate(scr.step).among.join("") };
  return { s: null, q: "", o: "" };
}
async function sync(){
  if (!st.voteUrl) return;
  const live = liveState(), sig = live.q + "|" + live.o, now = Date.now();
  const changed = st.liveSig !== sig;
  if (changed){ st.liveSig = sig; st.liveAt = now; save(); }
  if (!changed && (syncBusy || now - lastSync < (live.s ? 1400 : 5000))) return;
  lastSync = now; syncBusy = true;
  try {
    const params = new URLSearchParams({ action:"sync", k:PRESENTER_KEY, q:live.q, o:live.o, at:String(st.liveAt) });
    const r = await fetch(st.voteUrl + (st.voteUrl.includes("?") ? "&" : "?") + params, {cache:"no-store"});
    const j = await r.json();
    if (j.error || (live.s ? !j.counts : !j.ok)) throw new Error(j.error || "yanit");
    conn = "ok";
    if (live.s && liveState().q === live.q){
      const vs = vstate(live.s);
      ["1","2","3"].forEach(k => vs.counts[k] = (Number(j.counts[k]) || 0) + (vs.manual[k] || 0));
    }
  } catch(e){ conn = "err"; }
  finally {
    syncBusy = false;
    const cur = liveState(); if (cur.s) paintCounts(cur.s);
    const js = document.getElementById("joinState");
    if (js) js.textContent = conn === "err" ? "Sunucuya bağlanılamadı. İnterneti ve Apps Script dağıtımını kontrol edin." : "Sunucu bağlantısı hazır.";
  }
}
function qrPanel(caption){
  const qr = el("div", {class:"qr"});
  if (!st.voteUrl){
    qr.append(el("div", {class:"ph"}, "Oylama bağlantısı girilmedi. Kapak sayfasından adresi ekleyin ya da oyları 1-2-3 tuşlarıyla elle girin."));
    return qr;
  }
  const code = el("div", {class:"code", id:"qrcode"});
  qr.append(code, el("div", {class:"cap"}, caption));
  setTimeout(() => {
    try { new QRCode(code, { text: st.voteUrl, width: 640, height: 640, colorDark:"#0F1420", colorLight:"#FFFFFF", correctLevel: QRCode.CorrectLevel.M }); }
    catch(e){ code.replaceChildren(el("div", {class:"ph"}, "QR oluşturulamadı. Elle sayıma geçin.")); }
  }, 0);
  return qr;
}

/* ============ EKRANLAR ============ */
function render(){
  if (advanceTimer){ clearTimeout(advanceTimer); advanceTimer = null; }
  const f = flow();
  st.pos = Math.max(0, Math.min(st.pos, f.length-1));
  const scr = f[st.pos];
  const stage = $("#stage"); stage.replaceChildren();
  const wrap = el("div", {class:"fade", style:"display:flex;flex-direction:column;gap:0.8em;min-width:0"});
  stage.append(wrap);

  if (scr.t === "cover") renderCover(wrap);
  else if (scr.t === "cast") renderCast(wrap);
  else if (scr.t === "join") renderJoin(wrap);
  else if (scr.t === "scene"){
    wrap.append(el("div",{class:"eyebrow"}, el("span",null, scr.g===0 ? "Giriş" : "Bölüm "+scr.g), el("span",null, scr.title)));
    const pic = scr.art && art(scr.art, scr.title);
    const body = renderItems(scr.items, scr.g);
    wrap.append(pic ? el("div", {class:"scene-grid"}, body, pic) : body);
  }
  else if (scr.t === "vote") renderVote(wrap, scr.step, scr.g);
  else if (scr.t === "complete") renderComplete(wrap, scr.step);
  else if (scr.t === "path") renderPath(wrap);
  else if (scr.t === "reflect") renderReflect(wrap);
  else if (scr.t === "sources") renderSources(wrap);

  const prog = $("#prog"); prog.replaceChildren();
  ["Giriş","1","2","3","4","5","6","7"].forEach((lab, i) => {
    const g = scr.g === 8 ? 8 : scr.g;
    prog.append(el("span", {class: i<g ? "done" : (i===g ? "now" : "")}, lab));
  });
  const isLast = st.pos === f.length-1;
  const blocked = scr.t === "vote" && !st.choices[scr.step.id];
  $("#backBtn").disabled = st.pos === 0;
  $("#nextBtn").disabled = isLast && !blocked;
  $("#nextBtn").textContent = blocked ? "Sonucu göster" : (scr.t === "cover" ? "Başla →" : "İleri →");
  save(); tick(); sync(); fit();
}

function renderVote(w, s, g){
  const vs = vstate(s);
  const done = !!st.choices[s.id];
  w.append(el("div",{class:"eyebrow"}, el("span",null,"Soru "+g+" / "+STEPS.length), el("span",{class:"chip skill"}, s.skill), el("span",{class:"chip"}, s.format)));
  if (s.pre) w.append(el("p", {class:"story", style:"margin:0;color:var(--muted)"}, s.pre));
  w.append(el("h2", null, s.q));

  // QR paneli (hep aynı kod: geç katılanlar için ekranda durur)
  const qr = qrPanel("KATILMADIYSAN OKUT · SORU "+g);
  const left = el("div", {style:"display:flex;flex-direction:column;gap:0.5em;min-width:0"}, qr,
    el("div", {class:"total", id:"total"}, ""));

  const opts = el("div", {class:"opts"});
  ["1","2","3"].forEach(k => {
    const inPlay = vs.among.includes(k);
    let cls = "opt";
    if (done) cls += k === st.choices[s.id] ? " win" : " lose";
    else if (!inPlay) cls += " out";
    const can = !done && inPlay;
    opts.append(el("div", {class:cls, "data-k":k},
      el("i", {class:"fill", id:"fill-"+k}),
      el("div", {class:"num"}, done && k === st.choices[s.id] ? "✓" : k),
      el("div", {class:"txt"}, s.opts[k].t),
      el("div", {class:"right"},
        can ? el("button", {type:"button", "aria-label":"Seçenek "+k+" için elle oy azalt", onclick:()=>bump(s,k,-1)}, "−") : null,
        el("output", {id:"cnt-"+k}, String(vs.counts[k])),
        can ? el("button", {type:"button", "aria-label":"Seçenek "+k+" için elle oy ekle", onclick:()=>bump(s,k,1)}, "+") : null)));
  });
  w.append(el("div", {class:"vgrid"}, left, opts));

  const bar = el("div", {class:"vbar"});
  if (done){
    const k = st.choices[s.id];
    let txt = "Sınıf "+k+". seçeneği seçti ("+vs.counts[k]+" oy). Hikâye bu yoldan devam ediyor…";
    if (vs.lottery) txt = "İkinci oylama da eşit bitti. Kura "+k+". seçeneği seçti.";
    bar.append(el("div", {class:"banner ok"}, txt),
      el("button", {class:"btn", type:"button", onclick:()=>{ clearFrom(STEPS.indexOf(s)); render(); }}, "Yeniden oyla"));
  } else if (vs.phase === "tie"){
    bar.append(el("div", {class:"banner tie"}, "Eşitlik! Seçenek " + vs.among.join(" ve ") + " arasında 15 saniyelik yeni oylama. Telefonunuza bakın."),
      el("span", {class:"count", id:"tieCount"}, ""),
      el("button", {class:"btn primary", type:"button", onclick:()=>reveal(s)}, "Sonucu göster"),
      el("span", {class:"hint", id:"vmsg"}, ""));
  } else {
    bar.append(el("button", {class:"btn primary", type:"button", onclick:()=>reveal(s)}, "Sonucu göster"),
      el("span", {class:"hint", id:"vmsg"}, ""));
  }
  w.append(bar);
  paintCounts(s);
  if (done && st.autoNext === s.id){
    st.autoNext = null;
    advanceTimer = setTimeout(() => { const f = flow(); if (f[st.pos]?.t === "vote" && f[st.pos].step === s) next(); }, 2600);
  }
}
function paintCounts(s){
  const vs = vstate(s), sum = Math.max(1, total(vs));
  ["1","2","3"].forEach(k => {
    const o = document.getElementById("cnt-"+k); if (o) o.textContent = String(vs.counts[k]);
    const fl = document.getElementById("fill-"+k); if (fl) fl.style.width = (vs.among.includes(k) ? (vs.counts[k]/sum*100) : 0) + "%";
  });
  const t = $("#total");
  if (t) t.textContent = total(vs) + " oy" + (st.voteUrl ? (conn === "err" ? " · bağlantı sorunu, elle girin" : conn === "ok" ? " · canlı" : " · bağlanıyor…") : " · elle sayım");
}
function bump(s, k, d){
  const vs = vstate(s); if (st.choices[s.id] || !vs.among.includes(k)) return;
  if (vs.manual[k] + d < 0 && st.voteUrl) return;
  vs.manual[k] = (vs.manual[k]||0) + d;
  vs.counts[k] = Math.max(0, vs.counts[k] + d);
  paintCounts(s); save();
}
function reveal(s){
  const vs = vstate(s);
  const max = Math.max(...vs.among.map(k => vs.counts[k]));
  if (max === 0){ const m = $("#vmsg"); if (m) m.textContent = "Henüz oy yok."; return; }
  const top = vs.among.filter(k => vs.counts[k] === max);
  closeEnds = 0;
  if (top.length === 1){ st.choices[s.id] = top[0]; vs.phase = "done"; st.autoNext = s.id; }
  else if (vs.round === 0){
    vs.phase = "tie"; vs.round = 1; vs.among = top;
    top.forEach(k => { vs.counts[k] = 0; vs.manual[k] = 0; });
    tieEnds = Date.now()+15000;
  } else {
    const k = top[Math.floor(Math.random()*top.length)];
    vs.lottery = true; st.choices[s.id] = k; vs.phase = "done"; st.autoNext = s.id;
  }
  render();
}

  const r = el("button", {class:"btn", type:"button", onclick:()=>{
    if (!resetArm){ resetArm = true; r.textContent = "Emin misiniz? Tekrar basın"; setTimeout(()=>{ resetArm=false; if(r.isConnected) r.textContent="Baştan başla"; }, 3000); return; }
    const keep = {roles:st.roles, voteUrl:st.voteUrl || DEFAULT_VOTE_URL}; st = Object.assign(blank(), keep); st.session = Math.random().toString(36).slice(2,8); resetArm = false; render(); }}, "Baştan başla");
  w.append(el("div", {class:"vbar"}, r, el("span", {class:"hint"}, "Oylar ve yazılanlar silinir. Seslendirenler ve oylama bağlantısı kalır.")));
}

/* ============ GEZİNME ============ */
function next(){
  const f = flow(), scr = f[st.pos];
  if (scr.t === "vote" && !st.choices[scr.step.id]){ reveal(scr.step); return; }
  if (st.pos < f.length-1){ st.pos++; render(); window.scrollTo(0,0); }
}
function back(){ if (st.pos > 0){ st.pos--; render(); window.scrollTo(0,0); } }
$("#nextBtn").addEventListener("click", next);
$("#backBtn").addEventListener("click", back);
$("#themeBtn").addEventListener("click", toggleTheme);
$("#fsBtn").addEventListener("click", toggleFs);
function toggleTheme(){
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
}
function toggleFs(){
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); } catch(e) {}
}
/* Sahneye sığdırma: önce tam boy, taşarsa yazı adım adım küçülür (en az %55). */
const wideMQ = matchMedia("(min-width:761px)");
function fit(){
  const stage = $("#stage"), wrap = stage && stage.firstElementChild;
  if (!wrap) return;
  wrap.style.fontSize = "";
  if (!wideMQ.matches) return;
  const room = stage.clientHeight, grid = wrap.querySelector(".scene-grid");
  /* Çizim, sahnede yazıların dışında kalan yüksekliğe sığar; böylece yazıyı küçültmeye zorlamaz. */
  const artRoom = () => { if (grid) stage.style.setProperty("--stage-h", Math.max(140, room - (wrap.scrollHeight - grid.offsetHeight) - 34) + "px"); };
  /* Yer varsa yazı %20'ye kadar büyür, yoksa en az %55'e kadar küçülür. */
  let f = 1.2;
  wrap.style.fontSize = f + "em"; artRoom();
  while (wrap.scrollHeight > room && f > 0.55){ f = Math.round((f - 0.03) * 100) / 100; wrap.style.fontSize = f + "em"; artRoom(); }
}
addEventListener("resize", fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
if (window.ResizeObserver){ let fitQueued = false; new ResizeObserver(() => { if (fitQueued) return; fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fit(); }); }).observe(document.getElementById("stage")); }
document.addEventListener("keydown", e => {
  if (e.target.closest?.("input,textarea")) return;
  const f = flow(), scr = f[st.pos];
  if (["ArrowRight","PageDown"," "].includes(e.key)){ e.preventDefault(); next(); }
  else if (["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); back(); }
  else if (e.key === "Enter" && scr.t === "vote" && !st.choices[scr.step.id]){ e.preventDefault(); reveal(scr.step); }
  else if (/^Digit[123]$/.test(e.code) && scr.t === "vote"){ bump(scr.step, e.code.slice(-1), e.shiftKey ? -1 : 1); }
  else if (e.key === "t" || e.key === "T") toggleTheme();
  else if (e.key === "f" || e.key === "F") toggleFs();
});

/* ============ GERİ SAYIMLAR ============ */
function tick(){
  const f = flow(), scr = f[st.pos];
  const tc = $("#tieCount");
  if (tc && tieEnds){
    const left = tieEnds - Date.now();
    tc.textContent = left > 0 ? String(Math.ceil(left/1000)) : "0";
    if (left <= 0){ tieEnds = 0; if (scr?.t === "vote") reveal(scr.step); }
  }
  const cc = $("#closeCount");
  if (cc){
    const left = closeEnds - Date.now();
    cc.textContent = closeEnds ? (left > 0 ? String(Math.ceil(left/1000)) : "0") : "";
    if (closeEnds && left <= 0){ closeEnds = 0; if (scr?.t === "vote") reveal(scr.step); }
  }
}
setInterval(tick, 250);
setInterval(sync, 500);
render();
</script>
